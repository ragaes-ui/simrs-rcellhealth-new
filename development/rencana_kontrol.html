<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rencana Kontrol & SPRI</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            padding: 20px;
            color: #333;
        }

        /* Card Style */
        .card-kontrol {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.15);
            background: #fff;
            overflow: hidden;
        }

        /* Header Gradient (Indigo/Ungu) */
        .header-kontrol {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            color: white;
            position: relative;
        }
        
        .header-bg-icon {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 4.5rem;
            opacity: 0.15;
            color: white;
        }

        /* Form Styling */
        .form-floating > .form-control, 
        .form-floating > .form-select {
            border-radius: 10px;
            border: 1px solid #e0e0e0;
            height: 58px;
        }

        .form-floating > .form-control:focus,
        .form-floating > .form-select:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 4px rgba(118, 75, 162, 0.15);
        }

        /* Custom Radio Button (Tipe Surat) */
        .selector-item {
            position: relative;
            flex-grow: 1;
        }
        .selector-item_radio {
            appearance: none;
            display: none;
        }
        .selector-item_label {
            position: relative;
            width: 100%;
            text-align: center;
            padding: 10px;
            border: 1px solid #e0e0e0;
            color: #555;
            font-weight: 500;
            cursor: pointer;
            background-color: #fff;
            transition: all 0.3s;
        }
        /* Radius Kiri Kanan */
        .selector-item:first-child .selector-item_label { border-radius: 10px 0 0 10px; }
        .selector-item:last-child .selector-item_label { border-radius: 0 10px 10px 0; }

        /* State Checked */
        .selector-item_radio:checked + .selector-item_label {
            background-color: #764ba2;
            color: #fff;
            border-color: #764ba2;
            box-shadow: 0 4px 10px rgba(118, 75, 162, 0.3);
            z-index: 1;
        }

        /* Tombol Utama */
        .btn-buat {
            background: linear-gradient(to right, #6a11cb 0%, #2575fc 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 35px;
            font-weight: 600;
            color: white;
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.3);
            transition: all 0.3s;
        }

        .btn-buat:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 117, 252, 0.4);
        }

        /* Info Box */
        .info-sep {
            background-color: #f8f9fa;
            border-left: 4px solid #764ba2;
            padding: 15px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* Styling Tombol Kembali */
        .btn-back {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            padding: 8px 15px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s;
            z-index: 10;
        }
        .btn-back:hover {
            background: white;
            color: #6a11cb; /* Warna teks ungu saat hover */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                
                <form id="formKontrol">
                    <div class="card card-kontrol mb-4">
                        
                        <div class="header-kontrol">
                            <a href="#" class="btn-back">
                                <i class="fa fa-arrow-left me-2"></i> Kembali
                            </a>

                            <div class="d-flex align-items-center justify-content-center">
                                <div class="bg-white bg-opacity-25 rounded-circle p-3 me-3">
                                    <i class="fa fa-calendar-check fa-2x text-white"></i>
                                </div>
                                <div>
                                    <h4 class="mb-0 fw-bold">Rencana Kontrol & SPRI</h4>
                                    <small class="text-white-50">Penjadwalan Pasien Rawat Jalan & Inap</small>
                                </div>
                            </div>
                            <i class="fa fa-clock header-bg-icon"></i>
                        </div>

                        <div class="card-body p-4">
                            
                            <div class="d-flex w-100 mb-4">
                                <div class="selector-item">
                                    <input type="radio" id="radio1" name="tipeSurat" class="selector-item_radio" checked>
                                    <label for="radio1" class="selector-item_label"><i class="fa fa-file-invoice me-2"></i>Surat Kontrol (Rawat Jalan)</label>
                                </div>
                                <div class="selector-item">
                                    <input type="radio" id="radio2" name="tipeSurat" class="selector-item_radio">
                                    <label for="radio2" class="selector-item_label"><i class="fa fa-bed me-2"></i>SPRI (Rawat Inap)</label>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="noSep" placeholder="Nomor SEP">
                                        <label for="noSep">Nomor SEP / No. Kartu</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="date" class="form-control" id="tglKontrol">
                                        <label for="tglKontrol">Tanggal Rencana Kontrol</label>
                                    </div>
                                </div>
                            </div>

                            <div class="info-sep d-none" id="infoBox">
                                <strong><i class="fa fa-info-circle"></i> Data Pasien:</strong> 
                                <span class="ms-2 text-muted">BUDI SANTOSO (000123456) - Poli Dalam</span>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <select class="form-select" id="poliKontrol">
                                            <option selected disabled>-- Pilih Poli --</option>
                                            <option value="INT">Poli Penyakit Dalam</option>
                                            <option value="JANTUNG">Poli Jantung</option>
                                            <option value="SYARAF">Poli Syaraf</option>
                                        </select>
                                        <label for="poliKontrol">Poli Tujuan Kontrol</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <select class="form-select" id="dokterKontrol">
                                            <option selected disabled>-- Pilih Dokter --</option>
                                            <option value="1">dr. Spesialis A, Sp.PD</option>
                                            <option value="2">dr. Spesialis B, Sp.JP</option>
                                        </select>
                                        <label for="dokterKontrol">Dokter Penanggung Jawab</label>
                                    </div>
                                </div>
                            </div>

                        </div>
                        
                        <div class="card-footer bg-white border-top-0 p-4 pt-0 d-flex justify-content-between align-items-center">
                             <a href="#" class="text-decoration-none text-secondary small">
                                <i class="fa fa-list-alt me-1"></i> Lihat List Surat Kontrol
                            </a>

                            <div class="d-flex gap-2">
                                <button type="button" id="btnCariSep" class="btn btn-light border text-muted fw-bold">Cari No SEP</button>
                                <button type="button" id="btnBuatSurat" class="btn btn-buat">
                                    <i class="fa fa-plus-circle me-2"></i> Buat Surat
                                </button>
                            </div>
                        </div>

                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        // Set tanggal default ke BESOK
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('tglKontrol').valueAsDate = tomorrow;

        // Efek sederhana: Tampilkan info box saat No SEP diketik
        const sepInput = document.getElementById('noSep');
        sepInput.addEventListener('input', function() {
            const infoBox = document.getElementById('infoBox');
            if(this.value.length > 5) {
                infoBox.classList.remove('d-none');
            } else {
                infoBox.classList.add('d-none');
            }
        });

        // --- FUNGSI TOMBOL KEMBALI (KE MENU KOTAK) ---
        function kembaliKeMenu() {
            try {
                // Kembali ke menu Integrasi System di App.js
                window.parent.state.route = 'integrasiSystem';
                window.parent.m.redraw();
            } catch (e) {
                // Fallback jika gagal akses parent
                window.parent.location.reload();
            }
        }
        
        // Pasang event ke tombol kembali
        document.querySelector('.btn-back').onclick = (e) => {
            e.preventDefault();
            kembaliKeMenu();
        };

        // --- FUNGSI VALIDASI & NOTIFIKASI ---
        function handleButtonClick() {
            // 1. Ambil nilai Nomor SEP
            var noSepValue = document.getElementById('noSep').value;

            // 2. Cek apakah kosong
            if (noSepValue.trim() === "") {
                // Jika Kosong -> Warning
                Swal.fire({
                    icon: 'warning',
                    title: 'Data Belum Lengkap',
                    text: 'Mohon isi Nomor SEP / No. Kartu terlebih dahulu!',
                    confirmButtonColor: '#f0ad4e',
                    confirmButtonText: 'OK'
                });
            } else {
                // Jika Terisi -> Simulasi Error Server
                Swal.fire({
                    icon: 'error',
                    title: 'Koneksi Gagal',
                    text: 'Gagal terhubung ke server BPJS (V-Claim Web Service Timeout)',
                    confirmButtonColor: '#d33',
                    confirmButtonText: 'Tutup',
                    footer: '<a href="#">Cek status bridging?</a>'
                });
            }
        }

        // Pasang Event Listener ke kedua tombol
        document.getElementById('btnCariSep').addEventListener('click', handleButtonClick);
        document.getElementById('btnBuatSurat').addEventListener('click', handleButtonClick);

    </script>
</body>
</html>
