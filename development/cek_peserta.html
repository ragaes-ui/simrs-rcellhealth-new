<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Peserta BPJS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }

        /* Kartu Utama */
        .card-modern {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            background: white;
            transition: transform 0.3s ease;
        }
        
        .card-modern:hover {
            transform: translateY(-5px);
        }

        /* Header Kartu */
        .card-header-bpjs {
            background: linear-gradient(135deg, #009f78 0%, #007f60 100%);
            color: white;
            padding: 20px 30px;
            border-bottom: none;
            position: relative; /* Penting untuk posisi tombol kembali */
        }

        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            background-color: #f9f9f9;
            transition: all 0.3s;
        }

        .form-control:focus, .form-select:focus {
            background-color: #fff;
            border-color: #009f78;
            box-shadow: 0 0 0 4px rgba(0, 159, 120, 0.1);
        }

        .btn-cek {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
            width: 100%;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
            transition: all 0.3s ease;
        }

        .btn-cek:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.4);
        }

        .result-area {
            background: #eefbf6;
            border: 2px dashed #a8dcc8;
            border-radius: 15px;
            color: #007f60;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .icon-bg { font-size: 3rem; opacity: 0.3; margin-bottom: 10px; }

        /* Styling Tombol Kembali */
        .btn-back {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            padding: 8px 15px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn-back:hover {
            background: white;
            color: #007f60;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-8">
                
                <div class="card card-modern">
                    
                    <div class="card-header-bpjs d-flex align-items-center justify-content-center">
                    <a href="#" onclick="kembaliKeMenu()" class="btn-back">
                    <i class="fa fa-arrow-left me-2"></i> Kembali
                    </a>

                        <div class="d-flex align-items-center">
                            <div class="bg-white text-success rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width:40px; height:40px;">
                                <i class="fa fa-user-check fa-lg"></i>
                            </div>
                            <div>
                                <h5 class="mb-0 fw-bold">Cek Peserta BPJS Kesehatan</h5>
                                <small class="text-white-50">Integrasi V-Claim & Bridging System</small>
                            </div>
                        </div>
                    </div>

                    <div class="card-body p-4">
                        <form id="formCekPeserta">
                            <div class="row g-3 align-items-end">
                                
                                <div class="col-md-4">
                                    <label class="form-label fw-bold text-secondary small">Cari Berdasarkan</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 rounded-start-3 ps-3">
                                            <i class="fa fa-filter text-muted"></i>
                                        </span>
                                        <select class="form-select border-start-0" id="jenisKartu">
                                            <option value="nik">NIK (E-KTP)</option>
                                            <option value="noka">Nomor Kartu BPJS</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary small">Nomor Identitas</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-white border-end-0 rounded-start-3 ps-3">
                                            <i class="fa fa-id-card text-muted"></i>
                                        </span>
                                        <input type="text" id="nomorIdentitas" class="form-control border-start-0" placeholder="Masukkan 16 digit NIK atau 13 digit No.Kartu">
                                    </div>
                                </div>

                                <div class="col-md-2">
                                    <button type="button" class="btn btn-cek" id="btnCariPeserta">
                                        <i class="fa fa-search me-2"></i> Cari
                                    </button>
                                </div>
                            </div>
                        </form>

                        <hr class="my-4 opacity-25">

                        <div id="hasilCekPeserta" class="result-area p-4 text-center">
                            <i class="fa fa-database icon-bg"></i>
                            <h6 class="fw-bold">Data Belum Ditampilkan</h6>
                            <small class="text-muted">Silakan masukkan parameter pencarian di atas lalu klik tombol Cari.</small>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.getElementById('btnCariPeserta').addEventListener('click', function() {
            var inputNilai = document.getElementById('nomorIdentitas').value;

            if (inputNilai.trim() === "") {
                Swal.fire({
                    icon: 'warning',
                    title: 'Data Belum Lengkap',
                    text: 'Mohon isi Nomor Identitas (NIK/No.Kartu) terlebih dahulu!',
                    confirmButtonColor: '#f0ad4e',
                    confirmButtonText: 'OK'
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Koneksi Gagal',
                    text: 'Gagal terhubung ke server BPJS (V-Claim Web Service Timeout). Silahkan coba beberapa saat lagi.',
                    confirmButtonColor: '#d33',
                    confirmButtonText: 'Tutup',
                    footer: '<a href="#">Hubungi IT Support?</a>'
                });
            }
        });
        // --- FUNGSI KEMBALI KE MENU INTEGRASI ---
    function kembaliKeMenu() {
        try {
            // Mengakses variable 'state' di window induk (app.js)
            // Mengubah rute kembali ke menu kotak-kotak
            window.parent.state.route = 'integrasiSystem';
            
            // Meminta Mithril untuk merender ulang tampilan induk
            window.parent.m.redraw();
        } catch (e) {
            console.error("Gagal mengakses parent window:", e);
            // Fallback jika gagal: Refresh halaman (opsional)
            // window.parent.location.reload(); 
        }
    }
</script>

</body>
</html>
