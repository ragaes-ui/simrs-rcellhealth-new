<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembuatan SEP</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
            color: #333;
        }

        /* Card Style */
        .card-sep {
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
            background: #fff;
            overflow: hidden;
        }

        /* Header Gradient (Biru ke Hijau) */
        .header-sep {
            background: linear-gradient(120deg, #0d6efd 0%, #0dcaf0 100%);
            padding: 25px;
            color: white;
            position: relative;
        }
        
        /* Hiasan background header */
        .header-bg-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 5rem;
            opacity: 0.1;
            color: white;
        }

        /* Form Styling */
        .form-floating > .form-control, 
        .form-floating > .form-select {
            border-radius: 8px;
            border: 1px solid #dee2e6;
            height: 55px;
        }

        .form-floating > .form-control:focus,
        .form-floating > .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
        }

        .form-section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            margin-top: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        /* Tombol Utama */
        .btn-simpan {
            background: linear-gradient(to right, #198754, #20c997);
            border: none;
            border-radius: 10px;
            padding: 12px 40px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(32, 201, 151, 0.3);
            transition: all 0.3s;
        }

        .btn-simpan:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(32, 201, 151, 0.4);
        }

        .toggle-switch {
            cursor: pointer;
        }

        /* Styling Tombol Kembali */
        .btn-back {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            padding: 8px 15px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s;
            z-index: 10;
        }
        .btn-back:hover {
            background: white;
            color: #0d6efd;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                
                <form id="formSep">
                    <div class="card card-sep mb-4">
                        
                        <div class="header-sep">
                            <a href="#" onclick="window.parent.location.reload()" class="btn-back">
                                <i class="fa fa-arrow-left me-2"></i> Kembali
                            </a>

                            <div class="d-flex align-items-center justify-content-center">
                                <div class="bg-white bg-opacity-25 rounded-circle p-3 me-3">
                                    <i class="fa fa-file-medical fa-2x text-white"></i>
                                </div>
                                <div>
                                    <h4 class="mb-0 fw-bold">Pembuatan SEP</h4>
                                    <small class="text-white-50">Surat Eligibilitas Peserta - BPJS Kesehatan</small>
                                </div>
                            </div>
                            <i class="fa fa-laptop-medical header-bg-icon"></i>
                        </div>

                        <div class="card-body p-4">
                            
                            <div class="form-section-title"><i class="fa fa-address-card me-2"></i>Data Rujukan & Peserta</div>
                            
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="noRujukan" placeholder="No Rujukan" required>
                                        <label for="noRujukan">No. Rujukan / No. Kartu</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-floating">
                                        <input type="date" class="form-control" id="tglSep">
                                        <label for="tglSep">Tanggal SEP</label>
                                    </div>
                                </div>
                                <div class="col-md-3">
                                    <div class="form-floating">
                                        <select class="form-select" id="jenisPelayanan">
                                            <option value="2" selected>Rawat Jalan</option>
                                            <option value="1">Rawat Inap</option>
                                        </select>
                                        <label for="jenisPelayanan">Jns. Pelayanan</label>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section-title"><i class="fa fa-hospital-user me-2"></i>Data Medis & Tujuan</div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <select class="form-select" id="poliTujuan">
                                            <option selected disabled>-- Pilih Poli --</option>
                                            <option value="INT">Poli Penyakit Dalam</option>
                                            <option value="JAN">Poli Jantung</option>
                                            <option value="MAT">Poli Mata</option>
                                            <option value="BED">Poli Bedah</option>
                                        </select>
                                        <label for="poliTujuan">Poli Tujuan</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <select class="form-select" id="dpjp">
                                            <option selected disabled>-- Pilih Dokter --</option>
                                            <option value="1">Dr. Spesialis Dalam</option>
                                            <option value="2">Dr. Spesialis Bedah</option>
                                        </select>
                                        <label for="dpjp">Dokter DPJP</label>
                                    </div>
                                </div>

                                <div class="col-md-8">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="diagnosa" placeholder="Kode ICD-10">
                                        <label for="diagnosa">Diagnosa Awal (Kode ICD-10 / Nama)</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="noTelp" placeholder="08xxx">
                                        <label for="noTelp">No. Telepon Pasien</label>
                                    </div>
                                </div>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-12">
                                    <div class="form-floating">
                                        <textarea class="form-control" placeholder="Catatan" id="catatan" style="height: 80px"></textarea>
                                        <label for="catatan">Catatan (Opsional)</label>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="form-check form-switch mt-2">
                                        <input class="form-check-input toggle-switch" type="checkbox" id="checkboxKatarak">
                                        <label class="form-check-label" for="checkboxKatarak">Peserta Katarak?</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input toggle-switch" type="checkbox" id="checkboxCob">
                                        <label class="form-check-label" for="checkboxCob">Peserta COB (Coordination of Benefit)?</label>
                                    </div>
                                </div>
                            </div>

                        </div>
                        
                        <div class="card-footer bg-white border-top-0 p-4 pt-0 d-flex justify-content-between align-items-center">
                            <button type="reset" class="btn btn-light text-muted px-4 fw-bold">
                                <i class="fa fa-rotate-left me-2"></i> Reset
                            </button>
                            <button type="button" class="btn btn-simpan text-white" id="btnBuatSep">
                                <i class="fa fa-save me-2"></i> Buat SEP Sekarang
                            </button>
                        </div>

                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        // Set tanggal hari ini
        document.getElementById('tglSep').valueAsDate = new Date();

        // --- FUNGSI TOMBOL KEMBALI (KE MENU KOTAK) ---
        function kembaliKeMenu() {
            try {
                window.parent.state.route = 'integrasiSystem';
                window.parent.m.redraw();
            } catch (e) {
                window.parent.location.reload();
            }
        }
        // Ubah href tombol kembali agar memanggil fungsi ini
        document.querySelector('.btn-back').onclick = (e) => {
            e.preventDefault();
            kembaliKeMenu();
        };

        // --- LOGIKA NOTIFIKASI ---
        document.getElementById('btnBuatSep').addEventListener('click', function() {
            // 1. Ambil Input
            var noRujukan = document.getElementById('noRujukan').value;

            // 2. Validasi
            if (noRujukan.trim() === "") {
                Swal.fire({
                    icon: 'warning',
                    title: 'Data Belum Lengkap',
                    text: 'Mohon isi Nomor Rujukan / No. Kartu terlebih dahulu!',
                    confirmButtonColor: '#f0ad4e',
                    confirmButtonText: 'OK'
                });
            } else {
                // 3. Simulasi Error Server
                Swal.fire({
                    icon: 'error',
                    title: 'Koneksi Gagal',
                    text: 'Gagal terhubung ke server BPJS (V-Claim Web Service Timeout). Silahkan coba lagi nanti.',
                    confirmButtonColor: '#d33',
                    confirmButtonText: 'Tutup',
                    footer: '<a href="#">Cek Status Bridging?</a>'
                });
            }
        });
    </script>
</body>
</html>
